    const WOMEN_ARCHITECTS = new Set([
      "lina bo bardi", "farshid moussavi", "ray eames", "madelon vriesendorp",

    const LANGUAGES = ['en', 'es', 'fr', 'de', 'it', 'pt', 'ja', 'zh'];

    async function searchArchitect() {
      const name = document.getElementById('architectInput').value.trim();
      if (!name) return;

      const output = document.getElementById('output');
      output.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

      try {
        const scores = await getArchitectScores(name);
        if (!scores) {
          const info = await getArchitectInfo(name);
          if (info) {
            output.innerHTML = info;
            return;
          }
          output.innerHTML = '<div class="error"><div style="margin-bottom: 0.75rem; font-weight: 700;">Architect not found</div><div style="font-size: 0.9rem; line-height: 1.6;"><ul style="margin: 0; padding-left: 1.25rem;"><li style="margin-bottom: 0.5rem;">Check that the name is spelled correctly</li><li style="margin-bottom: 0.5rem;">The search tool references Wikidata, so lesser-known architects may not be indexed</li><li>This architect may still be a good fit for your assignment, speak with your professor/TA about further research options</li></ul></div></div>';

        }

        const { influence, recognition, movement, influenced, unesco, awards, key } = scores;
        let total = Math.min(influence + recognition, 100);
        if (key && WOMEN_ARCHITECTS.has(key) && key !== 'zaha hadid') {
          total = Math.max(total - 10, 0);
        }
        const tier = total >= 70 ? 'VERY VISIBLE' : total >= 40 ? 'BORDERLINE' : 'TARGET';

                <div class="score-region">VERY VISIBLE (70-100)</div>
              </div>
            </div>

              <div style="margin-top: 0.75rem;">This tool scores architect prominence on two dimensions: architectural influence (movement founding, influence on other architects, and UNESCO/landmark works) and professional recognition (major awards and prestige). Scores come from Wikidata, a structured database of biographical and professional data.</div>
              <div style="margin-top: 0.75rem; font-family: monospace; font-size: 0.8rem;">
                <div>Influence = min(M + I + U, 60)</div>
                <div style="margin-top: 0.35rem;">Recognition = min(A, 40)</div>
                <div style="margin-top: 0.35rem;">Score = min(Influence + Recognition, 100)</div>
              </div>
              <div style="margin-top: 0.75rem; font-family: monospace; font-size: 0.8rem; line-height: 1.9;">
                M = movement founding<br>
                I = influence on other architects<br>
                U = UNESCO/landmark works<br>

    async function getArchitectScores(name) {
      const key = name.toLowerCase();
      const match = Object.keys(HARDCODED_ARCHITECTS).find(k => key.includes(k) || (key.length >= 5 && k.includes(key)));

      if (match && HARDCODED_ARCHITECTS[match]) {
        const arch = HARDCODED_ARCHITECTS[match];
        const influence = arch.movement + arch.influenced + arch.unesco;
        const recognition = arch.awards;
        return {
          influence: Math.min(influence, 60),
          recognition: Math.min(recognition, 40),
          movement: arch.movement,
          influenced: arch.influenced,
          unesco: arch.unesco,
          awards: arch.awards,
          key: match
        };
      }

      try {
        for (const lang of LANGUAGES) {
          const wikidataEntity = await searchWikidata(name, lang);
          if (wikidataEntity) {
            const isArchitect = await checkIfArchitect(wikidataEntity);
            if (isArchitect) {
              const influence = await calculateInfluence(wikidataEntity);
              const recognition = await calculateRecognition(wikidataEntity);
              const isWoman = key !== 'zaha hadid' && await checkIsWoman(wikidataEntity);

              return {
                influence: Math.min(influence.total, 60),
                recognition: Math.min(recognition.total, 40),
                movement: influence.movement,
                influenced: influence.influenced,
                unesco: influence.unesco,
                awards: recognition.awards,
                isWoman
              };
            }
          }
        }
      } catch (err) {
        console.error('Wikidata error:', err);
      }

      return null;
    }

    async function searchWikidata(name, lang = 'en') {
      try {
        const response = await fetch(
          `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(name)}&language=${lang}&format=json&origin=*`,
          { signal: AbortSignal.timeout(5000) }
        );
        const data = await response.json();

        if (data.search && data.search.length > 0) {
          return data.search[0].id;
        }
        return null;
      } catch (err) {
        return null;
      }
    }

    async function getWikidataEntity(entityId) {
      try {
        const response = await fetch(
          `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${entityId}&format=json&origin=*`,
          { signal: AbortSignal.timeout(5000) }
        );
        const data = await response.json();
        return data.entities[entityId];
      } catch (err) {
        return null;
      }
    }

      try {
        for (const lang of LANGUAGES) {
          const wikidataEntity = await searchWikidata(name, lang);
          if (wikidataEntity) {
            const isArchitect = await checkIfArchitect(wikidataEntity);
            if (isArchitect) {
              const entity = await getWikidataEntity(wikidataEntity);
              const label = entity?.labels?.en?.value || name;
              const description = entity?.descriptions?.en?.value || '';

              const wikiSummary = await getWikipediaSummary(name, lang);

              return `
                <div style="border: 2px solid #000000; padding: 1.5rem; background: #ffffff;">
                  <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #000000; margin-bottom: 1rem; letter-spacing: -0.02em;">Not in our database</div>
                  <div style="font-size: 1.3rem; font-weight: 700; color: #000000; margin-bottom: 0.5rem; letter-spacing: -0.04em;">${label}</div>
                  <div style="font-size: 0.95rem; color: #000000; margin-bottom: 1rem; line-height: 1.5;">${description}</div>
                  ${wikiSummary ? `<div style="font-size: 0.9rem; color: #333333; background: #f5f5f5; padding: 1rem; border-left: 3px solid #000000; margin-bottom: 1rem; line-height: 1.6;">${wikiSummary}</div>` : ''}
                  <div style="font-size: 0.85rem; color: #666666; font-style: italic;">Consider researching this architect further. They may be a good fit for your students' research projects.</div>
                </div>
              `;
            }
          }
        }
      } catch (err) {
        console.error('Info lookup error:', err);
      }
      return null;
    }

    async function getWikipediaSummary(name, lang = 'en') {
      try {
        const response = await fetch(
          `https://${lang}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(name)}&prop=extracts&exintro=true&explaintext=true&format=json&origin=*`,
          { signal: AbortSignal.timeout(5000) }
        );
        const data = await response.json();
        const pages = data.query.pages;
        const page = Object.values(pages)[0];

        if (page.extract) {
          const summary = page.extract.split('\n')[0];
          return summary.substring(0, 300) + (summary.length > 300 ? '...' : '');
        }
      } catch (err) {
        return null;
      }
      return null;
    }

    async function checkIsWoman(entityId) {
      const entity = await getWikidataEntity(entityId);
      if (!entity) return false;
      const claims = entity.claims || {};
      if (claims.P21) {
        const genderId = claims.P21[0]?.mainsnak?.datavalue?.value?.id;
        if (genderId === 'Q6581072') return true;
      }
      return false;
    }

    async function checkIfArchitect(entityId) {
      const entity = await getWikidataEntity(entityId);
      if (!entity) return false;

      const claims = entity.claims || {};
      const label = entity.labels?.en?.value || '';
      const description = entity.descriptions?.en?.value || '';

      if (label.toLowerCase().includes('architect') || description.toLowerCase().includes('architect')) {
        return true;
      }

      if (claims.P106) {
        for (const occupation of claims.P106) {
          const occId = occupation.mainsnak.datavalue?.value?.id;
          if (occId) {
            const occEntity = await getWikidataEntity(occId);
            const occLabel = occEntity?.labels?.en?.value || '';
            if (occLabel.toLowerCase().includes('architect')) {
              return true;
            }
          }
        }
      }

      return false;
    }

    async function calculateInfluence(entityId) {
      const entity = await getWikidataEntity(entityId);
      if (!entity) return { total: 15, movement: 5, influenced: 5, unesco: 5 };

      let movement = 5;
      let influenced = 5;
      let unesco = 5;

      const claims = entity.claims || {};

      if (claims.P135 && claims.P135.length > 0) {
        movement = Math.min(5 + claims.P135.length * 12, 30);
      }

      if (claims.P738 && claims.P738.length > 0) {
        influenced = Math.min(5 + claims.P738.length * 5, 25);
      }

      if (claims.P625 && claims.P625.length > 0) {
        unesco = Math.min(5 + claims.P625.length * 3, 15);
      }

      if (claims.P800 && claims.P800.length > 0) {
        unesco = Math.min(unesco + claims.P800.length * 2, 15);
      }

      const label = entity.labels?.en?.value || '';
      if (label.toLowerCase().includes('architect') || label.toLowerCase().includes('building')) {
        unesco = Math.min(unesco + 3, 15);
      }

      return {
        total: movement + influenced + unesco,
        movement,
        influenced,
        unesco
      };
    }

    async function calculateRecognition(entityId) {
      const entity = await getWikidataEntity(entityId);
      if (!entity) return { total: 8, awards: 8 };

      let awards = 8;

      const claims = entity.claims || {};

      if (claims.P166 && claims.P166.length > 0) {
        const awardCount = claims.P166.length;
        awards = Math.min(8 + awardCount * 3, 30);

        try {
          const awardLabels = await Promise.all(
            claims.P166.slice(0, 5).map(async (award) => {
              const awardId = award.mainsnak.datavalue?.value?.id;
              if (!awardId) return '';
              const awardEntity = await getWikidataEntity(awardId);
              return awardEntity?.labels?.en?.value || '';
            })
          );

          if (awardLabels.some(label => label && (label.includes('Pritzker') || label.includes('RIBA') || label.includes('Hyatt')))) {
            awards = Math.min(awards + 10, 30);
          }
        } catch (err) {
          console.error('Award lookup error:', err);
        }
      }

      return {
        total: awards,
        awards
      };
    }

    function toggleMetricInfo(element, metric) {
      const metricDiv = element.closest('.metric');
      const info = metricDiv.nextElementSibling;
      const caret = element.querySelector('.metric-caret');

      if (info && info.classList.contains('metric-info')) {
        if (info.classList.contains('show')) {
          info.classList.remove('show');
          caret.classList.remove('open');
        } else {
          info.classList.add('show');
          caret.classList.add('open');
        }
      }
    }
  </script>
